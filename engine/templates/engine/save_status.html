{% comment %}
  ✨ Where a refusal is about one entry of a list, it says which, and main.js marks that field in the page.
{% endcomment %}
{% if refusal %}<span class="save-refused"{% if invalid_row %} data-invalid-row="{{ invalid_row }}" data-invalid-field="{{ invalid_field }}"{% endif %}>Not saved. {{ refusal }}</span>{% else %}Saved{% endif %}
