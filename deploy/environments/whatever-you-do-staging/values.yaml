# ✨ whatever-you-do-staging: the first environment (ticket 26). Only what differs from the chart's defaults.

tier: staging
host: anville-staging-01.vabl.dev
hostname: anville.vabl.dev

# Anyone may sign up (ticket 37). The instance holds fake data only, and says so where people sign up.
enrolment:
  required: false

# Let's Encrypt's real service from the first deploy. Browsers refuse .dev over anything but trusted HTTPS,
# so a certificate from the test issuer would give a site that cannot be opened.
issuer: letsencrypt-prod

# Backup level A: PostgreSQL in the namespace, and a nightly dump to the Storage Box.
postgres:
  enabled: true
  storage: 5Gi
backup:
  enabled: true
  schedule: "15 2 * * *"
