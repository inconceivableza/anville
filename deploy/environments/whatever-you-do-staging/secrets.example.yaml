# ✨ What the GitHub Environment named whatever-you-do-staging holds. This file gives the shape only:
# no value ever belongs in it. docs/server-approach.md, section 6, says more about each.
#
# Generate every secret afresh for this environment. None is reused from a development .env or from
# another environment.

variables:
  DEPLOY_HOST: The address of staging-1, as hcloud-create.sh printed it.
  ACME_EMAIL: Optional. Where Let's Encrypt sends notices about expiring certificates.

secrets:
  # Access to the host. The same three for every environment on staging-1.
  DEPLOY_SSH_KEY: The private key whose public half was given to hcloud-create.sh as DEPLOY_SSH_KEY_FILE.
  DEPLOY_KNOWN_HOSTS: "The output of: ssh-keyscan -t ed25519 <DEPLOY_HOST>"
  KUBECONFIG: "The output of: ssh <operator>@<DEPLOY_HOST> 'sudo cat /etc/rancher/k3s/k3s.yaml'"

  # The application.
  DJANGO_SECRET_KEY: "python -c 'from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())'"
  ANVILLE_ENROLMENT_CODE: The code a person needs to sign up here. Share it only with those who should.

  # The in-cluster database. Letters, digits, - and _ only, since it becomes part of a URL.
  # It is read when the database is first created. Changing it afterwards does not change the database.
  POSTGRES_PASSWORD: "openssl rand -hex 32"

  # The nightly backup, to a Storage Box sub-account that sees only this environment's directory.
  BACKUP_TARGET: "sftp://<sub-account>@<sub-account>.your-storagebox.de:23/"
  BACKUP_SSH_KEY: A private key made for this alone, whose public half the sub-account accepts.
  BACKUP_KNOWN_HOSTS: "The output of: ssh-keyscan -p 23 <sub-account>.your-storagebox.de"

  # Absent for now, so email is fake: each message is written to the pod's log and nothing is delivered.
  # Part 2 of ticket 26 adds it.
  # EMAIL_URL: "smtp+tls://<api key>:<secret key>@in-v3.mailjet.com:587"
